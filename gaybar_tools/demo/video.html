<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>视频任务点</title><link rel="stylesheet" href="style.css"><script src="common.js"></script></head><body class="activity-body"><h2>安全知识 · 视频</h2><p>请以正常速度完整播放演示视频，播放结束后点击右下角“下一节”。</p><div class="video-stage"><video id="lesson-video" controls preload="auto" playsinline src="lesson.webm"></video><button class="vjs-big-play-button" aria-label="播放视频" data-testid="play-video">▶ 播放</button></div><p class="test-progress" id="video-progress" role="status">视频未播放</p>
<script>
const video=document.getElementById('lesson-video');
const button=document.querySelector('.vjs-big-play-button');
let startedAt=0,seekEvents=0,playClicks=0;
button.addEventListener('click',event=>{playClicks++;recordDemo('video',{playClicks,playClickTrusted:event.isTrusted});video.play();});
video.addEventListener('loadedmetadata',()=>recordDemo('video',{duration:video.duration,ended:false,seekEvents:0,playbackRate:video.playbackRate}));
video.addEventListener('play',()=>{if(!startedAt)startedAt=performance.now();button.hidden=true;});
video.addEventListener('seeking',()=>recordDemo('video',{seekEvents:++seekEvents}));
video.addEventListener('ratechange',()=>recordDemo('video',{playbackRate:video.playbackRate}));
video.addEventListener('timeupdate',()=>{document.getElementById('video-progress').textContent=`已播放 ${video.currentTime.toFixed(1)} / ${video.duration.toFixed(1)} 秒`;});
video.addEventListener('ended',()=>{
  const elapsed=(performance.now()-startedAt)/1000;
  recordDemo('video',{duration:video.duration,currentTime:video.currentTime,elapsed,ended:video.ended,seekEvents,playbackRate:video.playbackRate});
  document.getElementById('video-progress').textContent='视频播放完成';
  signalDemo('content-complete');
});
</script></body></html>
